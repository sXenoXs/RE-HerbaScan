name: herbascan
description: "HerbaScan: A CNN-Based Mobile Application for Herbal Plant Recognition and Data Retrieval"
publish_to: "none"

version: 0.1.3+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI and Icons
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # Camera and Image Processing
  camera: ^0.11.2
  image_picker: ^1.0.4
  image: ^4.5.4

  # AI/ML
  tflite_flutter: ^0.11.0

  # HTTP and Networking
  http: ^1.1.0
  connectivity_plus: ^6.0.5

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # File and Storage
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2

  # UI Components
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  lottie: ^3.3.2

  # Utilities
  uuid: ^4.2.1
  logger: ^2.0.2+1

  # Device Preview for testing different screen sizes
  device_preview: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/
    - assets/data/
    - assets/animations/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
