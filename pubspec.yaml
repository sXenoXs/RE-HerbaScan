name: herbascan
description: "A complete, self-contained offline-first flutter app for local plant identification with 42 medicinal plants, powered by TFLite and a smart offline-sync layer."
publish_to: "none"

version: 0.9.7+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI and Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1

  # State Management
  provider: ^6.1.2

  # Database
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.3.7  # Desktop (Windows/Linux/macOS) only; mobile unchanged
  path: ^1.9.0

  # Camera and Image Processing
  camera: ^0.11.2+1
  image_picker: ^1.1.2
  image: ^4.5.4

  # AI/ML
  tflite_flutter: ^0.12.1

  # HTTP and Networking
  http: ^1.2.2
  connectivity_plus: ^7.0.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # File and Storage
  path_provider: ^2.1.5
  shared_preferences: ^2.3.2

  # UI Components
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  lottie: ^3.3.2

  # Utilities
  uuid: ^4.5.1
  logger: ^2.5.0

  # Markdown rendering
  flutter_markdown: ^0.6.18

  # Supabase (Auth, Database, Storage - Personal Herbarium)
  supabase_flutter: ^2.8.0
  # Deep links (auth callback: password reset, change email)
  app_links: ^6.3.2

  # Device Preview for testing different screen sizes
  device_preview: ^1.2.0

  # Calendar export (preparation schedule)
  add_2_calendar: ^2.2.5

  # Static Habitat Heatmap (OpenStreetMap; no API key)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Routing (web + admin guard)
  go_router: ^14.6.2

  # Plant catalog images from Supabase Storage (admin uploads)
  cached_network_image: ^3.4.1

  # 2D Interactive Silhouette: parse SVG path d="..." to Flutter Path
  path_drawing: ^1.0.1

  # 6-box OTP input (enter_signup_code_screen, enter_reset_code_screen)
  pinput: ^5.0.0

  # PRD v0.9.5: Share, Gallery export, Preparation timers
  gal: ^2.3.0
  share_plus: ^10.0.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/
    - assets/data/
    - assets/animations/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
